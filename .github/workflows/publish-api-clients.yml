name: Publish API Clients

on:
  workflow_call:
    inputs:
      spec-path:
        required: true
        type: string
      api-name:
        required: true
        type: string
      version:
        required: true
        type: string
      ts-package:
        required: true
        type: string
      maven-group:
        required: true
        type: string
      java-artifact:
        required: true
        type: string
      kotlin-artifact:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      openapi-client-gradle-version:
        required: false
        type: string
        default: "0.3.0"
      node-version:
        required: false
        type: string
        default: "24"
      java-version:
        required: false
        type: string
        default: "21"
      npm-registry-url:
        required: false
        type: string
        default: "https://npm.pkg.github.com"
      require-package-proxy:
        required: false
        type: boolean
        default: false
    secrets:
      packages-token:
        required: false
      node-auth-token:
        required: false
      PACKAGES_PROXY_TOKEN:
        description: Packages proxy API token. When set, Gradle and npm resolve packages through the proxy.
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  clients:
    name: API Clients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.49.1 # x-release-please-version
          path: .github-workflows
          persist-credentials: false

      - uses: ./.github-workflows/actions/setup-java-gradle
        with:
          java-version: ${{ inputs.java-version }}
          github-packages-token: ${{ secrets.packages-token || github.token }}
          packages-proxy-token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: ${{ inputs.require-package-proxy }}

      # Install Node + configure the GitHub Packages registry only. Do NOT install here —
      # the typescript project is created by api-client-publish, which runs npm install itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.npm-registry-url }}

      - uses: ./.github-workflows/actions/setup-package-proxy
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: ${{ inputs.require-package-proxy }}
          go: 'false'
          python: 'false'
          cargo: 'false'

      - name: Generate and verify all clients
        uses: ./.github-workflows/actions/api-client-publish
        with:
          mode: dry-run
          spec-path: ${{ inputs.spec-path }}
          api-name: ${{ inputs.api-name }}
          version: ${{ inputs.version }}
          ts-package: ${{ inputs.ts-package }}
          maven-group: ${{ inputs.maven-group }}
          java-artifact: ${{ inputs.java-artifact }}
          kotlin-artifact: ${{ inputs.kotlin-artifact }}
          openapi-client-gradle-version: ${{ inputs.openapi-client-gradle-version }}
          npm-registry-url: ${{ inputs.npm-registry-url }}
        env:
          GITHUB_TOKEN: ${{ secrets.packages-token || github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.node-auth-token || secrets.packages-token || github.token }}

      - name: Publish all clients
        if: ${{ !inputs.dry-run }}
        uses: ./.github-workflows/actions/api-client-publish
        with:
          mode: publish
          spec-path: ${{ inputs.spec-path }}
          api-name: ${{ inputs.api-name }}
          version: ${{ inputs.version }}
          ts-package: ${{ inputs.ts-package }}
          maven-group: ${{ inputs.maven-group }}
          java-artifact: ${{ inputs.java-artifact }}
          kotlin-artifact: ${{ inputs.kotlin-artifact }}
          openapi-client-gradle-version: ${{ inputs.openapi-client-gradle-version }}
          npm-registry-url: ${{ inputs.npm-registry-url }}
        env:
          GITHUB_TOKEN: ${{ secrets.packages-token || github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.node-auth-token || secrets.packages-token || github.token }}
