name: 'Add to Project'

'on':
  # Manual recovery hatch. Event-driven runs are the normal path, but when
  # GitHub stops creating runs from webhooks - which has happened, stranding
  # 24 issues at once - there was previously no way to board anything by hand.
  # Dispatch with a content-url to board one item, or leave it empty to
  # backfill every open issue and pull request in this repository.
  'workflow_dispatch':
    'inputs':
      'content-url':
        'description': 'Issue or PR URL to add. Empty = backfill all open issues and PRs in this repo.'
        'required': false
        'type': 'string'
        'default': ''
      'project-url':
        'description': 'Organization Project URL.'
        'required': false
        'type': 'string'
        'default': 'https://github.com/orgs/JorisJonkers-dev/projects/2'
      'scope':
        'description': 'repo = this repository only. org = every repository in the organization.'
        'required': false
        'type': 'choice'
        'default': 'repo'
        'options':
          - 'repo'
          - 'org'
  'workflow_call':
    'inputs':
      'manual':
        'description': 'Caller was dispatched by hand: add by URL instead of from the event.'
        'required': false
        'type': 'boolean'
        'default': false
      'content-url':
        'description': 'Issue or PR URL to add. Empty with manual=true backfills all open issues and PRs.'
        'required': false
        'type': 'string'
        'default': ''
      'project-url':
        'description': 'Organization Project URL.'
        'required': false
        'type': 'string'
        'default': 'https://github.com/orgs/JorisJonkers-dev/projects/2'
      'scope':
        'description': 'repo = the calling repository only. org = every repository in the organization. Implies manual.'
        'required': false
        'type': 'string'
        'default': 'repo'
    'secrets':
      'PROJECT_AUTOMATION_APP_ID':
        'description': 'GitHub App id with organization Projects write permission.'
        'required': false
      'PROJECT_AUTOMATION_APP_PRIVATE_KEY':
        'description': 'Private key for the organization Project automation App.'
        'required': false
      'PROJECT_AUTOMATION_TOKEN':
        'description': 'Fallback token with organization Project write permission.'
        'required': false

'permissions':
  'contents': 'read'

'jobs':
  'add-to-project':
    'name': 'Add to Project'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 30
    'if': "${{ github.event_name == 'workflow_dispatch' || github.event.issue.node_id != '' || github.event.pull_request.node_id != '' }}"
    'env':
      'PROJECT_AUTOMATION_APP_ID': '${{ secrets.PROJECT_AUTOMATION_APP_ID }}'
      'PROJECT_AUTOMATION_APP_PRIVATE_KEY': '${{ secrets.PROJECT_AUTOMATION_APP_PRIVATE_KEY }}'
    'steps':
      - 'name': 'Mint organization Project token'
        'id': 'app-token'
        'if': '${{ env.PROJECT_AUTOMATION_APP_ID != '''' && env.PROJECT_AUTOMATION_APP_PRIVATE_KEY != '''' }}'
        'uses': 'actions/create-github-app-token@v3'
        'with':
          'app-id': '${{ env.PROJECT_AUTOMATION_APP_ID }}'
          'private-key': '${{ env.PROJECT_AUTOMATION_APP_PRIVATE_KEY }}'
          'owner': '${{ github.repository_owner }}'
          'permission-organization-projects': 'write'
          'permission-issues': 'read'
          'permission-pull-requests': 'read'
          # Needed to enumerate the organization's repositories for scope: org.
          'permission-metadata': 'read'

      - 'name': 'Validate Project token'
        'env':
          'PROJECT_TOKEN': '${{ steps.app-token.outputs.token || secrets.PROJECT_AUTOMATION_TOKEN }}'
        'run': |
          set -euo pipefail

          if [ -z "$PROJECT_TOKEN" ]; then
            echo '::error::Configure PROJECT_AUTOMATION_APP_ID and PROJECT_AUTOMATION_APP_PRIVATE_KEY, or PROJECT_AUTOMATION_TOKEN.'
            exit 1
          fi

      - 'name': 'Add issue or pull request'
        'if': "${{ github.event_name != 'workflow_dispatch' && !inputs.manual && inputs.scope != 'org' }}"
        'uses': 'actions/add-to-project@v2.0.0'
        'with':
          'project-url': '${{ inputs.project-url }}'
          'github-token': '${{ steps.app-token.outputs.token || secrets.PROJECT_AUTOMATION_TOKEN }}'

      # actions/add-to-project reads the triggering event, so it cannot serve a
      # manual run. This adds items by explicit URL instead.
      - 'name': 'Add by URL (manual recovery, or sweep)'
        'if': "${{ github.event_name == 'workflow_dispatch' || inputs.manual || inputs.scope == 'org' }}"
        'env':
          'GH_TOKEN': '${{ steps.app-token.outputs.token || secrets.PROJECT_AUTOMATION_TOKEN }}'
          'PROJECT_URL': '${{ inputs.project-url }}'
          'CONTENT_URL': '${{ inputs.content-url }}'
          'REPO': '${{ github.repository }}'
          'SCOPE': '${{ inputs.scope || ''repo'' }}'
        'run': |
          set -euo pipefail

          owner="$(printf '%s' "$PROJECT_URL" | sed -E 's#.*/orgs/([^/]+)/projects/.*#\1#')"
          number="$(printf '%s' "$PROJECT_URL" | sed -E 's#.*/projects/([0-9]+).*#\1#')"
          # $o/$n are GraphQL variables, not shell expansions.
          # shellcheck disable=SC2016
          project_id="$(gh api graphql -f query='
            query($o:String!,$n:Int!){ organization(login:$o){ projectV2(number:$n){ id } } }
          ' -f o="$owner" -F n="$number" --jq '.data.organization.projectV2.id')"
          [ -n "$project_id" ] || { echo "::error::could not resolve project id from $PROJECT_URL"; exit 1; }

          unreachable=0
          urls_file="$(mktemp)"

          # Appends one repo's open issue and PR urls to $urls_file, or warns
          # and appends nothing when the App cannot see it. A repo the token
          # was never granted must not fail an org-wide sweep -- that is a fact
          # about installation scope, not about the board.
          #
          # Deliberately writes to a file rather than returning urls on stdout:
          # a $(collect_repo ...) call would run in a subshell, losing the
          # unreachable counter and capturing the ::warning:: lines into the
          # url list instead of emitting them.
          collect_repo() {
            target="$1"
            if ! issues="$(gh issue list --repo "$target" --state open --limit 500 --json url --jq '.[].url' 2>/dev/null)"; then
              echo "::warning::skipping $target: issues not readable by this token"
              unreachable=$((unreachable+1))
              return 0
            fi
            prs="$(gh pr list --repo "$target" --state open --limit 500 --json url --jq '.[].url' 2>/dev/null || true)"
            printf '%s\n%s\n' "$issues" "$prs" >> "$urls_file"
          }

          if [ -n "$CONTENT_URL" ]; then
            urls="$CONTENT_URL"
          elif [ "$SCOPE" = 'org' ]; then
            # Billing follows the caller, never the repo holding this workflow.
            # An org-wide sweep therefore only saves minutes when it is called
            # from a PUBLIC repo, where standard runners are free -- see the
            # scheduled caller in the org's .github repository.
            repos="$(gh repo list "$owner" --limit 1000 --no-archived \
              --json nameWithOwner --jq '.[].nameWithOwner')"
            repo_count="$(printf '%s\n' "$repos" | grep -c . || true)"
            echo "::notice::org-wide backfill across ${repo_count} repo(s) in $owner"
            for target in $repos; do
              collect_repo "$target"
            done
            urls="$(cat "$urls_file")"
          else
            echo "::notice::backfilling every open issue and pull request in $REPO"
            collect_repo "$REPO"
            urls="$(cat "$urls_file")"
            # For a single named repo, unreadable is a real failure rather than
            # an installation-scope fact: the caller asked for exactly this one.
            if [ "$unreachable" -ne 0 ]; then
              echo "::error::$REPO is not readable by this token"
              exit 1
            fi
          fi

          added=0; skipped=0
          for url in $urls; do
            [ -n "$url" ] || continue
            node_id="$(gh api "$(printf '%s' "$url" \
              | sed -E 's#https://github.com/([^/]+)/([^/]+)/(issues|pull)/([0-9]+)#repos/\1/\2/\3/\4#; s#/pull/#/pulls/#')" \
              --jq '.node_id' 2>/dev/null || true)"
            if [ -z "$node_id" ]; then
              echo "::warning::could not resolve $url"; continue
            fi
            # addProjectV2ItemById is idempotent: re-adding returns the existing item.
            # $p/$c are GraphQL variables, not shell expansions.
            # shellcheck disable=SC2016
            if gh api graphql -f query='
              mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item { id } } }
            ' -f p="$project_id" -f c="$node_id" >/dev/null 2>&1; then
              added=$((added+1))
            else
              skipped=$((skipped+1)); echo "::warning::failed to add $url"
            fi
          done
          echo "::notice::added/confirmed $added item(s), $skipped failure(s), $unreachable unreadable repo(s)"
          # Unreadable repos are reported but do not fail the sweep; a genuine
          # failure to add a resolvable item still does.
          [ "$skipped" -eq 0 ]
