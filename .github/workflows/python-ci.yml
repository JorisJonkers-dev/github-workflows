name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to install.
        required: false
        type: string
        default: '3.13'
      install-command:
        description: Dependency install command.
        required: false
        type: string
        # Pin the pip used for the upgrade; Renovate moves the pin. The
        # --uploaded-prior-to cooldown keeps brand-new releases out of CI.
        default: >-
          python -m pip install --disable-pip-version-check "pip==26.2.2"
          && python -m pip install --uploaded-prior-to P7D -r requirements-dev.txt
      lint-command:
        description: Ruff check command. The command must fail on diagnostics.
        required: false
        type: string
        default: ruff check .
      typecheck-command:
        description: Type check command. Use mypy or pyright, and keep it failing on errors.
        required: false
        type: string
        default: python -m mypy .
      test-command:
        description: Test command.
        required: false
        type: string
        default: python -m unittest discover
      working-directory:
        description: Directory that contains the Python project.
        required: false
        type: string
        default: .
      require-package-proxy:
        description: When true, a missing PACKAGES_PROXY_TOKEN fails the job. Empty or false only warns.
        required: false
        type: boolean
        default: false
    secrets:
      PACKAGES_PROXY_TOKEN:
        description: Packages proxy API token. When set, pip and uv resolve packages through the proxy.
        required: false

permissions:
  contents: read

jobs:
  python:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.45.0 # x-release-please-version
          path: .github-workflows
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - uses: ./.github-workflows/actions/setup-package-proxy
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: ${{ inputs.require-package-proxy }}
          go: 'false'
          node: 'false'
          cargo: 'false'

      - name: Install dependencies
        if: ${{ inputs.install-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Lint
        if: ${{ inputs.lint-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$LINT_COMMAND"

      - name: Typecheck
        if: ${{ inputs.typecheck-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          TYPECHECK_COMMAND: ${{ inputs.typecheck-command }}
        run: bash -euo pipefail -c "$TYPECHECK_COMMAND"

      - name: Test
        if: ${{ inputs.test-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"
