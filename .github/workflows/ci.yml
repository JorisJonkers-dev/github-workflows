# Canonical single CI workflow for every JorisJonkers-dev repository.
#
# Org convention: ONE pipeline per repo, and it terminates in a single
# aggregating job named "Pipeline Complete". That job name is the ONLY
# required status check in the org/repo ruleset -- every other job feeds
# into it via `needs:`. Adding or renaming an upstream job never requires
# touching branch protection: as long as it is in `needs:` below, it gates
# merges through the aggregator.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash "$ACTIONLINT_VERSION" /tmp
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  yaml-validity:
    name: YAML Validity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install YAML parser
        run: |
          python3 -m venv .venv-yaml
          .venv-yaml/bin/python -m pip install PyYAML==6.0.2

      - name: Validate YAML files
        run: |
          .venv-yaml/bin/python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          files = sorted(
              path for path in Path(".").rglob("*")
              if path.suffix in {".yml", ".yaml"} and ".git" not in path.parts
          )

          failed = False
          for path in files:
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      yaml.safe_load(handle)
              except Exception as exc:
                  failed = True
                  print(f"::error file={path}::{exc}")

          if failed:
              sys.exit(1)

          print(f"Validated {len(files)} YAML files.")
          PY

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install coverage
        run: |
          python3 -m venv .venv-tests
          .venv-tests/bin/python -m pip install coverage==7.10.7 PyYAML==6.0.2

      - name: Run migration guard tests with coverage
        run: |
          .venv-tests/bin/python -m coverage run --source=scripts.check_migrations -m unittest discover -s tests
          .venv-tests/bin/python -m coverage report --fail-under=80

      # The bucket decision gates other repositories' suites, so every line and branch of it is held.
      - name: Run path bucket tests with branch coverage
        run: |
          .venv-tests/bin/python -m coverage run --branch --source=scripts.path_buckets -m unittest tests.test_path_buckets
          .venv-tests/bin/python -m coverage report --show-missing --fail-under=100

      # The mutation report is what reviewers read to judge a pull request's tests, so every line and
      # branch of it is held too.
      - name: Run mutation report tests with branch coverage
        if: ${{ !cancelled() }}
        run: |
          .venv-tests/bin/python -m coverage run --branch --source=scripts.mutation_report -m unittest tests.test_mutation_report
          .venv-tests/bin/python -m coverage report --show-missing --fail-under=100

      # The ranges decide which lines Stryker mutates, so a wrong one reports on lines nobody changed.
      - name: Run changed-ranges tests with branch coverage
        if: ${{ !cancelled() }}
        run: |
          .venv-tests/bin/python -m coverage run --branch --source=scripts.changed_ranges -m unittest tests.test_changed_ranges
          .venv-tests/bin/python -m coverage report --show-missing --fail-under=100

      # A quarantine check that passes when it should fail lets a skipped test stay skipped forever.
      - name: Run quarantine check tests with branch coverage
        if: ${{ !cancelled() }}
        run: |
          .venv-tests/bin/python -m coverage run --branch --source=scripts.quarantine_check -m unittest tests.test_quarantine_check
          .venv-tests/bin/python -m coverage report --show-missing --fail-under=100

      # A wrong verdict either blocks every pull request in the estate or lets agent attribution
      # through, so every line and branch of it is held.
      - name: Run PR title check tests with branch coverage
        if: ${{ !cancelled() }}
        run: |
          .venv-tests/bin/python -m coverage run --branch --source=scripts.pr_title_check -m unittest tests.test_pr_title_check
          .venv-tests/bin/python -m coverage report --show-missing --fail-under=100

  # ---------------------------------------------------------------------------
  # Terminal aggregator. This is the single required check in the ruleset.
  # It runs even when an upstream job fails/cancels (if: always()) and then
  # explicitly fails unless every dependency succeeded -- so a skipped or
  # failed gating job can never be mistaken for a green pipeline.
  # ---------------------------------------------------------------------------
  node-tests:
    name: Deploy Check Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deploy-check dependencies
        working-directory: tools/deploy-check
        run: npm ci --no-audit --no-fund
      - name: Run deploy-check unit tests
        working-directory: tools/deploy-check
        run: npm test

  pipeline-complete:
    name: Pipeline Complete
    if: always()
    needs: [actionlint, yaml-validity, python-tests, node-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify all gating jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
