# Publishes one project file's Intent Fragment for one release, and starts
# composition (deploy-kit spec/v1/40-composition.md, spec/v1/55-delivery.md).
#
#   release tag -> images built -> this workflow:
#     validate -> pack with the release's version -> push -> sign keyless
#     -> read back and verify -> dispatch composition in the Estate repository
#
# Call it once per project file, after the release's images exist. A merge that
# is not released publishes nothing: the caller triggers on the tag.
#
# Every decision is a deploy-kit command, at the version the calling
# repository's own lockfile pins. The scripts beside it only hand the command
# its arguments and move bytes.
#
# The signature's identity is this workflow, run for the calling repository, so
# composition verifies every fragment against one subject and reads the
# repository from the certificate.
#
# ONE job: jobs are billed by the minute, rounded up.
name: Publish Fragment

on:
  workflow_call:
    inputs:
      project-file:
        description: The project file to publish, relative to the repository root.
        required: true
        type: string
      version:
        description: The release, as its tag (vX.Y.Z) or bare (X.Y.Z).
        required: true
        type: string
      ref:
        description: The commit the release's images were built from. Defaults to the commit that triggered the caller.
        required: false
        type: string
        default: ""
      validate-with:
        description: Paths read together with the project file when it is validated, space separated; a directory is read as every file below it.
        required: false
        type: string
        default: ""
      migration-proof-artifact:
        description: >-
          Name of an uploaded artifact holding migration-proof.yml, written by
          JorisJonkers-dev/liquibase-runner's migration-proof action earlier in the
          caller's run. It lands beside the project file before the fragment is packed.
        required: false
        type: string
        default: ""
      toolkit-directory:
        description: The directory holding the package.json and package-lock.json that pin @jorisjonkers-dev/deploy-kit.
        required: false
        type: string
        default: "."
      node-version:
        description: The Node the toolkit runs on.
        required: false
        type: string
        default: "24"
      compose:
        description: Start composition in the Estate repository once the fragment is published.
        required: false
        type: boolean
        default: true
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY:
        description: The dispatch App's private key (an organization secret). Required when compose is true.
        required: false
    outputs:
      ref:
        description: The published fragment, by digest.
        value: ${{ jobs.publish.outputs.ref }}
      digest:
        description: The published fragment's digest.
        value: ${{ jobs.publish.outputs.digest }}
      project:
        description: The Project the fragment declares.
        value: ${{ jobs.publish.outputs.project }}

permissions: {}

concurrency:
  # One publish per project file at a time, so `latest` is never raced.
  group: publish-fragment-${{ github.repository }}-${{ inputs.project-file }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Fragment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
      project: ${{ steps.pack.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # This repository at the release the caller pinned, so the scripts and the
      # workflow file are the same version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.18.0 # x-release-please-version
          path: .github-workflows
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@jorisjonkers-dev"

      - name: Install the toolkit at the version this repository pins
        working-directory: ${{ inputs.toolkit-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          TOOLKIT_DIRECTORY: ${{ inputs.toolkit-directory }}
        run: |
          # The version lives in one place, the caller's lockfile, which Renovate
          # moves. Nothing here names a version, and `npx --no-install` below
          # can only run what this step installed.
          npm ci --ignore-scripts
          # Called with nothing to do, the command answers with its usage and
          # exits 2. Anything else means the pinned release has no command.
          npx --no-install deploy-kit >/dev/null 2>&1 || [ "$?" -eq 2 ] || {
            echo "::error::@jorisjonkers-dev/deploy-kit in ${TOOLKIT_DIRECTORY}/package-lock.json ships no deploy-kit command; pin a release that does"
            exit 1
          }

      - name: Fetch the migration proof
        if: ${{ inputs.migration-proof-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.migration-proof-artifact }}
          path: .migration-proof

      - name: Put the migration proof beside the project file
        if: ${{ inputs.migration-proof-artifact != '' }}
        env:
          PROJECT_FILE: ${{ inputs.project-file }}
        run: |
          test -f .migration-proof/migration-proof.yml || {
            echo "::error::the artifact holds no migration-proof.yml"
            exit 1
          }
          cp .migration-proof/migration-proof.yml "$(dirname "$PROJECT_FILE")/migration-proof.yml"

      - name: Validate and pack
        id: pack
        env:
          PROJECT_FILE: ${{ inputs.project-file }}
          VALIDATE_WITH: ${{ inputs.validate-with }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          REPOSITORY: ${{ github.repository }}
          TOOLKIT_DIRECTORY: ${{ inputs.toolkit-directory }}
          OUT: ${{ runner.temp }}/fragment
        run: bash .github-workflows/actions/publish-fragment/pack.sh

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Push, sign and read back
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRAGMENT: ${{ runner.temp }}/fragment
          PROJECT: ${{ steps.pack.outputs.project }}
          VERSION: ${{ steps.pack.outputs.version }}
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          OWNER: ${{ github.repository_owner }}
          SIGNED_REPOSITORY: ${{ github.repository }}
        run: |
          echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash .github-workflows/actions/publish-fragment/push.sh

      # The dispatch App can start a run in the Estate repository and cannot
      # push to it (deploy-kit spec/v1/60-setup.md#the-estate-repository).
      - name: Mint a token for the Estate repository
        id: estate
        if: ${{ inputs.compose }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ESTATE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: estate

      - name: Start composition
        if: ${{ inputs.compose }}
        env:
          GH_TOKEN: ${{ steps.estate.outputs.token }}
          ESTATE: ${{ github.repository_owner }}/estate
          FRAGMENT_REF: ${{ steps.push.outputs.ref }}
        run: |
          # Composition pulls every participant's newest fragment itself; the
          # dispatch only says that one moved. It is pushed, not polled: a cron
          # in this estate runs hours late.
          gh workflow run compose.yml --repo "$ESTATE" --ref main
          echo "composition started in ${ESTATE} for ${FRAGMENT_REF}"
