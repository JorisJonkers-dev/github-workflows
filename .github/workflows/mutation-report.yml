name: Mutation Report

# Reports, on a pull request, the mutants that survive on the lines it changes: a test ran the
# line, yet no test failed when it changed. gremlins mutates Go, Stryker mutates TypeScript and
# Vue. One comment is kept up to date per pull request. It is a report and never fails the build
# (workspace docs/testing-standards.md, section 6).
#
# The caller's toolchain comes from its mise.toml. A web directory needs @stryker-mutator/core and
# @stryker-mutator/vitest-runner as devDependencies, so Stryker runs with the project's own vitest.

on:
  workflow_call:
    inputs:
      go-directory:
        description: Directory of the Go module to mutate; empty skips Go.
        type: string
        default: ''
      web-directory:
        description: Directory of the web project to mutate; empty skips TypeScript.
        type: string
        default: ''
      gremlins-version:
        description: gremlins release to install.
        type: string
        default: v0.6.0

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Mutation report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Checkout github-workflows at this workflow file's own released version; release-please
      # keeps the literal in step with the tag this file ships in.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.27.0 # x-release-please-version
          path: .github-workflows
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Mutate the changed Go
        if: ${{ inputs.go-directory != '' }}
        continue-on-error: true
        working-directory: ${{ inputs.go-directory }}
        env:
          BASE: origin/${{ github.base_ref }}
          GREMLINS: ${{ inputs.gremlins-version }}
        run: |
          go install "github.com/go-gremlins/gremlins/cmd/gremlins@$GREMLINS"
          "$(go env GOPATH)/bin/gremlins" unleash --diff "$BASE" --output "$RUNNER_TEMP/gremlins.json" ./...

      - name: Mutate the changed TypeScript
        if: ${{ inputs.web-directory != '' }}
        continue-on-error: true
        working-directory: ${{ inputs.web-directory }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --diff-filter=AM --relative "$BASE"...HEAD -- src \
            | grep -E '\.(ts|vue)$' | grep -Ev '\.(spec|test)\.ts$|\.gen\.ts$|/infrastructure/api/' | paste -sd, - || true)
          if [ -z "$changed" ]; then
            echo "No changed TypeScript or Vue source to mutate."
            exit 0
          fi
          pnpm install --frozen-lockfile
          pnpm exec stryker run --testRunner vitest --reporters json,clear-text \
            --jsonReporter.fileName "$RUNNER_TEMP/mutation.json" --mutate "$changed"

      - name: Write the report
        run: |
          python3 .github-workflows/scripts/mutation_report.py \
            --gremlins "$RUNNER_TEMP/gremlins.json" --stryker "$RUNNER_TEMP/mutation.json" \
            --out "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- mutation-report -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          fi
