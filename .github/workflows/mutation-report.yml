name: Mutation Report

# Reports, on a pull request, the mutants that survive on the lines it changes: a test ran the
# line, yet no test failed when it changed. gremlins mutates Go, Stryker mutates TypeScript and
# Vue. One comment is kept up to date per pull request. It is a report and never fails the build
# (workspace docs/testing-standards.md, section 6).
#
# The caller's toolchain comes from its mise.toml. A web directory tests with Vitest and has
# @stryker-mutator/core as a devDependency. Stryker mutates only the changed lines, one changed file
# at a time, in place, and runs `vitest related` on that file against each mutant: its Vitest test
# runner switches no mutant on under Vitest 5, and its sandbox loses imports from outside the web
# directory, such as a contract file beside it.

on:
  workflow_call:
    inputs:
      go-directory:
        description: Directory of the Go module to mutate; empty skips Go.
        type: string
        default: ''
      web-directory:
        description: Directory of the web project to mutate; empty skips TypeScript.
        type: string
        default: ''
      gremlins-version:
        description: gremlins release to install.
        type: string
        default: v0.6.0

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Mutation report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Checkout github-workflows at this workflow file's own released version; release-please
      # keeps the literal in step with the tag this file ships in.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.34.1 # x-release-please-version
          path: .github-workflows
          persist-credentials: false

      # Pull-request only, so it reads the default branch's mise cache and never saves its own.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache_save: false

      - name: Mutate the changed Go
        id: go
        if: ${{ inputs.go-directory != '' }}
        continue-on-error: true
        working-directory: ${{ inputs.go-directory }}
        env:
          BASE: origin/${{ github.base_ref }}
          GREMLINS: ${{ inputs.gremlins-version }}
        run: |
          go install "github.com/go-gremlins/gremlins/cmd/gremlins@$GREMLINS"
          bin=$(go env GOBIN)
          # gremlins reads the module root as `.`; given `./...` it finds no mutants at all. Each
          # mutant reruns the tests, and the default timeout times out a race-enabled suite.
          # --integration runs every test per mutant: otherwise gremlins tests the directory named
          # after the Go package, so a mutant in `package main` runs no tests and reads as survived.
          "${bin:-$(go env GOPATH)/bin}/gremlins" unleash --integration --diff "$BASE" --timeout-coefficient 40 \
            --output "$RUNNER_TEMP/gremlins.json" .

      - name: Mutate the changed TypeScript
        id: web
        if: ${{ inputs.web-directory != '' }}
        continue-on-error: true
        working-directory: ${{ inputs.web-directory }}
        env:
          BASE: origin/${{ github.base_ref }}
          RANGES: ${{ github.workspace }}/.github-workflows/scripts/changed_ranges.py
        run: |
          git diff -U0 --diff-filter=AM --relative "$BASE"...HEAD -- src \
            | python3 "$RANGES" \
            | awk -F'\t' '$1 ~ /\.(ts|vue)$/ && $1 !~ /\.(spec|test|gen)\.ts$/ && $1 !~ /\/infrastructure\/api\//' \
            > "$RUNNER_TEMP/ranges.tsv" || true
          if [ ! -s "$RUNNER_TEMP/ranges.tsv" ]; then
            echo "No changed TypeScript or Vue source to mutate."
            exit 0
          fi
          pnpm install --frozen-lockfile
          i=0
          while IFS=$'\t' read -r file spans; do
            i=$((i + 1))
            jq -n --arg file "$file" --arg out "$RUNNER_TEMP/stryker-$i.json" '{
              testRunner: "command",
              commandRunner: {command: ("pnpm exec vitest related --run " + $file)},
              coverageAnalysis: "off",
              inPlace: true,
              reporters: ["json"],
              jsonReporter: {fileName: $out}
            }' > "$RUNNER_TEMP/stryker-$i.conf.json"
            echo "::group::$file"
            pnpm exec stryker run "$RUNNER_TEMP/stryker-$i.conf.json" --mutate "$spans" --concurrency "$(nproc)"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/ranges.tsv"

      - name: Write the report
        env:
          GO_OUTCOME: ${{ steps.go.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          GO_DIRECTORY: ${{ inputs.go-directory }}
          WEB_DIRECTORY: ${{ inputs.web-directory }}
        run: |
          failed=()
          [ "$GO_OUTCOME" = failure ] && failed+=(--failed gremlins)
          [ "$WEB_OUTCOME" = failure ] && failed+=(--failed Stryker)
          stryker=()
          for report in "$RUNNER_TEMP"/stryker-*.json; do
            case "$report" in *.conf.json) ;; *) [ -f "$report" ] && stryker+=(--stryker "$report") ;; esac
          done
          python3 .github-workflows/scripts/mutation_report.py \
            --gremlins "$RUNNER_TEMP/gremlins.json" "${stryker[@]}" \
            --go-root "${GO_DIRECTORY:-.}" --web-root "${WEB_DIRECTORY:-.}" \
            "${failed[@]}" --out "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- mutation-report -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          fi
