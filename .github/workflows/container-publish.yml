name: Container Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name below ghcr.io/<owner>/.
        required: true
        type: string
      version:
        description: Release version tag.
        required: true
        type: string
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms.
        required: false
        type: string
        default: linux/amd64
      software-version:
        description: >-
          The version of the software inside the image, stamped as its
          org.opencontainers.image.version label. Left empty, it is the tag of
          the Dockerfile's digest-pinned upstream base, or the release version
          for an image of our own software.
        required: false
        type: string
        default: ""
    secrets:
      packages-token:
        description: Token passed as docker build secret github_token.
        required: false
      packages-proxy-token:
        description: Packages proxy API token. When set, Go and Python dependencies resolve through the packages proxy.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Container Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # This repository at the release the caller pinned, for the script below.
      - uses: actions/checkout@v7
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.43.0 # x-release-please-version
          path: .github-workflows
          persist-credentials: false

      - name: Work out the software version
        id: software
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          RELEASE: ${{ inputs.version }}
          OVERRIDE: ${{ inputs.software-version }}
        run: bash .github-workflows/actions/container-publish/software-version.sh

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Write packages proxy netrc
        id: proxy
        shell: bash
        # secrets is not usable in a step if:, so opt-in is checked in bash.
        env:
          PACKAGES_PROXY_TOKEN: ${{ secrets.packages-proxy-token }}
        run: |
          set -euo pipefail

          [ -n "$PACKAGES_PROXY_TOKEN" ] || exit 0

          printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"
          umask 077
          netrc="$RUNNER_TEMP/packages-netrc"
          {
            printf 'machine packages.jorisjonkers.dev\n'
            printf 'login packages\n'
            printf 'password %s\n' "$PACKAGES_PROXY_TOKEN"
          } > "$netrc"
          printf 'netrc=%s\n' "$netrc" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}"
          if [ "$image_ref" != "$(printf '%s' "$image_ref" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::Docker image reference must be lowercase: $image_ref"
            exit 1
          fi

          {
            echo 'tags<<EOF'
            printf '%s:%s\n' "$image_ref" "$VERSION"
            printf '%s:sha-%s\n' "$image_ref" "$GITHUB_SHA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            ${{ steps.software.outputs.version != '' && format('org.opencontainers.image.version={0}', steps.software.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          # Only a default-branch push writes the cache: a tag's or pull request's cache can be
          # restored by no later run, so it would only fill the repository's 10 GB.
          cache-to: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && format('type=gha,mode=max,scope={0}', inputs.image-name) || '' }}
          # Proxy build args and secret only apply with a token; the
          # conditional yields '' so an unset token changes nothing. The token
          # itself only travels as the BuildKit secret file, never as a build
          # arg or in a URL.
          build-args: |
            ${{ secrets.packages-proxy-token != '' && 'GOPROXY=https://packages.jorisjonkers.dev/go' || '' }}
            ${{ secrets.packages-proxy-token != '' && 'PIP_INDEX_URL=https://packages.jorisjonkers.dev/pypi/simple/' || '' }}
            ${{ secrets.packages-proxy-token != '' && 'UV_DEFAULT_INDEX=https://packages.jorisjonkers.dev/pypi/simple/' || '' }}
          secrets: |
            github_token=${{ secrets.packages-token || github.token }}
            github_actor=${{ github.actor }}
            ${{ secrets.packages-proxy-token != '' && format('id=packages-netrc,src={0}', steps.proxy.outputs.netrc) || '' }}
