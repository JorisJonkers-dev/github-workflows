name: Container Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name below ghcr.io/<owner>/.
        required: true
        type: string
      version:
        description: Release version tag.
        required: true
        type: string
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms.
        required: false
        type: string
        default: linux/amd64
    secrets:
      packages-token:
        description: Token passed as docker build secret github_token.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Container Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}"
          if [ "$image_ref" != "$(printf '%s' "$image_ref" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::Docker image reference must be lowercase: $image_ref"
            exit 1
          fi

          {
            echo 'tags<<EOF'
            printf '%s:%s\n' "$image_ref" "$VERSION"
            printf '%s:sha-%s\n' "$image_ref" "$GITHUB_SHA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
          secrets: |
            github_token=${{ secrets.packages-token || github.token }}
            github_actor=${{ github.actor }}
