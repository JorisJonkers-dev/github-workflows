name: Container Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name below ghcr.io/<owner>/.
        required: true
        type: string
      version:
        description: Release version tag.
        required: true
        type: string
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms.
        required: false
        type: string
        default: linux/amd64
      software-version:
        description: >-
          The version of the software inside the image, stamped as its
          org.opencontainers.image.version label. Left empty, it is the tag of
          the Dockerfile's digest-pinned upstream base, or the release version
          for an image of our own software.
        required: false
        type: string
        default: ""
      require-package-proxy:
        description: When true, a missing PACKAGES_PROXY_TOKEN fails the job. Empty or false only warns.
        required: false
        type: boolean
        default: false
    secrets:
      packages-token:
        description: Token passed as docker build secret github_token.
        required: false
      PACKAGES_PROXY_TOKEN:
        description: Packages proxy API token. When set, Go, Python and npm dependencies resolve through the packages proxy.
        required: false
      packages-proxy-token:
        description: Deprecated name of PACKAGES_PROXY_TOKEN, kept for callers pinned to v0.44.0. Used only when PACKAGES_PROXY_TOKEN is not passed.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Container Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository at the release the caller pinned, for the script below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.50.0 # x-release-please-version
          path: .github-workflows
          persist-credentials: false

      - name: Work out the software version
        id: software
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          RELEASE: ${{ inputs.version }}
          OVERRIDE: ${{ inputs.software-version }}
        run: bash .github-workflows/actions/container-publish/software-version.sh

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Write packages proxy netrc
        id: proxy
        shell: bash
        # secrets is not usable in a step if:, so opt-in is checked in bash.
        env:
          PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN || secrets.packages-proxy-token }}
          REQUIRE_PACKAGE_PROXY: ${{ inputs.require-package-proxy }}
        run: |
          set -euo pipefail

          if [ -z "$PACKAGES_PROXY_TOKEN" ]; then
            if [ "$REQUIRE_PACKAGE_PROXY" = true ]; then
              echo "::error::PACKAGES_PROXY_TOKEN is not set and require-package-proxy is true. Pass the PACKAGES_PROXY_TOKEN secret: secrets: inherit, or the one-line form in README.md."
              exit 1
            fi
            echo "::warning::PACKAGES_PROXY_TOKEN is not set; packages install without the proxy. Pass the secret, or set require-package-proxy to true to fail instead."
            exit 0
          fi

          printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"
          umask 077
          netrc="$RUNNER_TEMP/packages-netrc"
          {
            printf 'machine packages.jorisjonkers.dev\n'
            printf 'login packages\n'
            printf 'password %s\n' "$PACKAGES_PROXY_TOKEN"
          } > "$netrc"
          npmrc="$RUNNER_TEMP/packages-npmrc"
          {
            printf 'registry=https://packages.jorisjonkers.dev/npm/\n'
            printf '//packages.jorisjonkers.dev/npm/:_authToken=%s\n' "$PACKAGES_PROXY_TOKEN"
            printf '@jorisjonkers-dev:registry=https://npm.pkg.github.com\n'
          } > "$npmrc"
          {
            printf 'netrc=%s\n' "$netrc"
            printf 'npmrc=%s\n' "$npmrc"
            printf 'enabled=true\n'
          } >> "$GITHUB_OUTPUT"

      # BuildKit reads a mirror's credentials from the host's Docker config,
      # so the proxy login runs before the builder and the build. Without a
      # token the step's if is false and nothing changes.
      - name: Log in to the packages proxy registry
        if: steps.proxy.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: packages.jorisjonkers.dev
          username: packages
          password: ${{ secrets.PACKAGES_PROXY_TOKEN || secrets.packages-proxy-token }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # With a token, base images pull through the proxy: it mirrors
          # Docker Hub, ghcr.io, gcr.io and quay.io over the OCI
          # distribution API. BuildKit falls back to the registry itself
          # when the mirror cannot serve an image, so our private
          # ghcr.io/jorisjonkers-dev/* images still pull from GHCR. Without
          # a token every line renders empty: no mirror.
          buildkitd-config-inline: |
            ${{ steps.proxy.outputs.enabled == 'true' && '[registry."docker.io"]' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && '  mirrors = ["packages.jorisjonkers.dev"]' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && '[registry."ghcr.io"]' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && '  mirrors = ["packages.jorisjonkers.dev"]' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && '[registry."gcr.io"]' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && '  mirrors = ["packages.jorisjonkers.dev"]' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && '[registry."quay.io"]' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && '  mirrors = ["packages.jorisjonkers.dev"]' || '' }}

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${owner}/${IMAGE_NAME}"
          if [ "$image_ref" != "$(printf '%s' "$image_ref" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::Docker image reference must be lowercase: $image_ref"
            exit 1
          fi

          {
            echo 'tags<<EOF'
            printf '%s:%s\n' "$image_ref" "$VERSION"
            printf '%s:sha-%s\n' "$image_ref" "$GITHUB_SHA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            ${{ steps.software.outputs.version != '' && format('org.opencontainers.image.version={0}', steps.software.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          # Only a default-branch push writes the cache: a tag's or pull request's cache can be
          # restored by no later run, so it would only fill the repository's 10 GB.
          cache-to: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && format('type=gha,mode=max,scope={0}', inputs.image-name) || '' }}
          # Proxy build args and secret only apply with a token; the
          # conditional yields '' so an unset token changes nothing. The token
          # itself only travels as the BuildKit secret file, never as a build
          # arg or in a URL.
          build-args: |
            ${{ steps.proxy.outputs.enabled == 'true' && 'GOPROXY=https://packages.jorisjonkers.dev/go' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && 'PIP_INDEX_URL=https://packages.jorisjonkers.dev/pypi/simple/' || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && 'UV_DEFAULT_INDEX=https://packages.jorisjonkers.dev/pypi/simple/' || '' }}
          secrets: |
            github_token=${{ secrets.packages-token || github.token }}
            github_actor=${{ github.actor }}
          # A file secret is mounted with --mount=type=secret,id=<name>. The secrets
          # input takes only name=value pairs, so the files go here.
          secret-files: |
            ${{ steps.proxy.outputs.enabled == 'true' && format('packages-netrc={0}', steps.proxy.outputs.netrc) || '' }}
            ${{ steps.proxy.outputs.enabled == 'true' && format('packages-npmrc={0}', steps.proxy.outputs.npmrc) || '' }}
