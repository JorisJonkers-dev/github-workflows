name: 'Repository Hygiene Guard'

'on':
  'workflow_call':
    'inputs':
      'base-ref':
        'description': 'Base ref used for PR comparison.'
        'required': false
        'type': 'string'
        'default': ''
      'override-label':
        'description': 'Pull request label that bypasses this guard.'
        'required': false
        'type': 'string'
        'default': 'allow-repository-hygiene-exception'
      'allowlist-regex':
        'description': 'Python regex for intentional exceptions.'
        'required': false
        'type': 'string'
        'default': ''
      'package-proxy-guard':
        'description': 'report (default) prints package proxy findings and passes; enforce fails the job.'
        'required': false
        'type': 'string'
        'default': 'report'
      'agents-md-lint':
        'description': 'report (default) warns about a missing AGENTS.md or a dead path or symbol in it and passes; enforce fails the job.'
        'required': false
        'type': 'string'
        'default': 'report'
      'deny-globs':
        'description': 'Newline-separated denied path globs.'
        'required': false
        'type': 'string'
        'default': |
          .specify/**
          specs/[0-9][0-9][0-9]-*/**
          plans/**
          planning/**
          scratchpad/**
          scratchpads/**
          .agent-council/**
          **/*scratchpad*.md
          **/*.scratch.md
          **/*agent-council*.md
          .claude/commands/speckit*.md
          .claude/skills/speckit*/**
          .agents/skills/speckit*/**
          templates/**/.specify/**
          templates/**/.claude/commands/speckit*.md
    'secrets':
      'PACKAGES_PROXY_TOKEN':
        'description': 'Packages proxy API token. Only fetches PyYAML for the package proxy guard; the guard never fails without it.'
        'required': false

'permissions':
  'contents': 'read'
  'pull-requests': 'read'

'jobs':
  'guard':
    'name': 'Repository Hygiene Guard'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 30
    'if': '${{ !contains(github.event.pull_request.labels.*.name, inputs.override-label) }}'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        'with':
          'fetch-depth': 0

      - 'name': 'Check denied planning artifacts'
        'env':
          'BASE_REF_INPUT': '${{ inputs.base-ref }}'
          'BASE_REF_FALLBACK': '${{ format(''origin/{0}'', github.event.pull_request.base.ref || github.event.repository.default_branch || ''main'') }}'
          'DENY_GLOBS': '${{ inputs.deny-globs }}'
          'ALLOWLIST_REGEX': '${{ inputs.allowlist-regex }}'
        'run': |
          set -euo pipefail

          base_ref="${BASE_REF_INPUT:-$BASE_REF_FALLBACK}"
          # fetch-depth 0 already holds every branch; a depth-1 fetch would shallow the base
          # tip and drop its history, so the three-dot diff finds no merge base.
          git rev-parse --verify --quiet "${base_ref}^{commit}" >/dev/null \
            || git fetch --no-tags origin "${base_ref#origin/}" || true
          export BASE_REF="$base_ref"

          # The guard must compute a diff or fail; it never passes on an unchecked range.
          if ! git rev-parse --verify --quiet "${base_ref}^{commit}" >/dev/null; then
            echo "::error::Base ref ${base_ref} is not in the checkout, so the changed files cannot be listed. Fix the base-ref input or the checkout."
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          if ! git merge-base "$base_ref" HEAD >/dev/null; then
            echo "::error::HEAD and ${base_ref} share no commit in this checkout (shallow history?), so the changed files cannot be listed. The guard fails rather than pass unchecked."
            exit 1
          fi

          python3 - <<'PY'
          import fnmatch
          import os
          import re
          import subprocess
          import sys

          base_ref = os.environ['BASE_REF']
          deny_globs = [
              line.strip()
              for line in os.environ['DENY_GLOBS'].splitlines()
              if line.strip() and not line.strip().startswith('#')
          ]
          allowlist_raw = os.environ.get('ALLOWLIST_REGEX', '').strip()
          allowlist = re.compile(allowlist_raw) if allowlist_raw else None

          try:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', '--diff-filter=ACMR', f'{base_ref}...HEAD'],
                  text=True,
              ).splitlines()
          except subprocess.CalledProcessError as error:
              print(f'::error::git diff {base_ref}...HEAD failed (exit {error.returncode}); the guard cannot check the changed files and fails rather than pass.')
              sys.exit(1)

          denied = []
          for path in changed:
              if allowlist and allowlist.search(path):
                  continue
              if any(fnmatch.fnmatchcase(path, pattern) for pattern in deny_globs):
                  denied.append(path)

          if denied:
              print('::error::Denied planning/agent scratch artifacts were added or modified:')
              for path in denied:
                  print(f'  - {path}')
              print('')
              print('Move planning material to issues/PRs or durable docs, or apply the override label for an approved exception.')
              sys.exit(1)
          PY

      - 'name': 'Check out github-workflows for the package proxy guard'
        'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        'with':
          'repository': 'JorisJonkers-dev/github-workflows'
          'ref': 'v0.50.3' # x-release-please-version
          'path': '.github-workflows'
          'persist-credentials': false

      # The guard runs for every caller, including pull requests from forks, which get no
      # secrets. Its only install is its own pinned PyYAML, so a missing token warns and the
      # guard still runs, rather than failing every caller that does not pass the secret.
      - 'name': 'Set up the packages proxy for the guard'
        'uses': './.github-workflows/actions/setup-package-proxy'
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'false'

      # A caller on @main between a merge and the next release has a github-workflows checkout
      # without the guard script; skip the guard with a notice rather than fail the caller.
      - 'name': 'Locate the package proxy guard'
        'id': 'guard-script'
        'run': |
          set -euo pipefail

          if [ -f .github-workflows/scripts/package_proxy_guard.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::.github-workflows has no package_proxy_guard.py at its pinned release; the package proxy guard is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - 'name': 'Install PyYAML for the package proxy guard'
        'if': "${{ steps.guard-script.outputs.present == 'true' }}"
        'env':
          'PACKAGES_PROXY_TOKEN': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
        'run': |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/package-proxy-guard"
          python="$RUNNER_TEMP/package-proxy-guard/bin/python"
          index_args=()
          if [ -n "$PACKAGES_PROXY_TOKEN" ]; then
            printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"
            # pip reads ~/.netrc for the proxy credential; the token is never in the index URL.
            umask 077
            netrc="$HOME/.netrc"
            {
              if [ -f "$netrc" ]; then
                awk 'BEGIN { keep = 1 } $1 == "machine" { keep = $2 != "packages.jorisjonkers.dev" } $1 == "default" { keep = 1 } keep { print }' "$netrc"
              fi
              printf 'machine packages.jorisjonkers.dev\n'
              printf 'login packages\n'
              printf 'password %s\n' "$PACKAGES_PROXY_TOKEN"
            } > "$netrc.tmp"
            mv "$netrc.tmp" "$netrc"
            chmod 600 "$netrc"
            index_args=(--index-url https://packages.jorisjonkers.dev/pypi/simple/)
          else
            echo "::notice::PACKAGES_PROXY_TOKEN is not set; PyYAML for the guard installs from PyPI."
          fi
          "$python" -m pip install --disable-pip-version-check "pip==26.2.2"
          "$python" -m pip install --uploaded-prior-to P7D "${index_args[@]}" --quiet PyYAML==6.0.2

      - 'name': 'Check package proxy use'
        'if': "${{ steps.guard-script.outputs.present == 'true' }}"
        'env':
          'PACKAGE_PROXY_GUARD': '${{ inputs.package-proxy-guard }}'
        'run': |
          set -euo pipefail

          args=()
          case "$PACKAGE_PROXY_GUARD" in
            report)
              args+=(--report-only)
              ;;
            enforce)
              ;;
            *)
              echo "::error::package-proxy-guard must be report or enforce"
              exit 1
              ;;
          esac

          "$RUNNER_TEMP/package-proxy-guard/bin/python" .github-workflows/scripts/package_proxy_guard.py \
            --root . --allowlist .github/package-proxy-allow.txt "${args[@]}"

  # Every repository carries an AGENTS.md (spec #392, B7-03). The lint fails on a missing or empty
  # file and on a path or symbol in it that no longer exists. It starts in report mode so a
  # repository that has not added the file yet is not blocked; flip the input to enforce once it has.
  'agents-md':
    'name': 'AGENTS.md Lint'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        'with':
          'persist-credentials': false

      - 'name': 'Check out github-workflows for the AGENTS.md lint'
        'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        'with':
          'repository': 'JorisJonkers-dev/github-workflows'
          'ref': 'v0.50.3' # x-release-please-version
          'path': '.github-workflows'
          'persist-credentials': false

      # A caller between a merge and the next release has a github-workflows checkout without
      # the script; skip with a notice rather than fail the caller.
      - 'name': 'Locate the AGENTS.md lint'
        'id': 'agents-script'
        'run': |
          set -euo pipefail

          if [ -f .github-workflows/scripts/check_agents_md.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::.github-workflows has no check_agents_md.py at its pinned release; the AGENTS.md lint is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - 'name': 'Check AGENTS.md for a missing file, dead paths and dead symbols'
        'if': "${{ steps.agents-script.outputs.present == 'true' }}"
        'env':
          'AGENTS_MD_LINT': '${{ inputs.agents-md-lint }}'
        'run': |
          set -euo pipefail

          case "$AGENTS_MD_LINT" in
            report | enforce) ;;
            *)
              echo "::error::agents-md-lint must be report or enforce"
              exit 1
              ;;
          esac

          status=0
          python3 .github-workflows/scripts/check_agents_md.py . || status=$?
          if [ "$status" -ne 0 ] && [ "$AGENTS_MD_LINT" = report ]; then
            echo "::warning::AGENTS.md lint found problems (report mode, not failing). Fix them, then set agents-md-lint: enforce."
            exit 0
          fi
          exit "$status"

  # Owner decision 2026-11-09: no commit or pull request credits an AI agent, model or provider
  # (scripts/attribution_guard.py, data/attribution-identities.json). The override label never
  # skips it. It needs a pull_request event: on any other event it is skipped.
  'attribution':
    'name': 'Agent Attribution Guard'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'if': "${{ github.event.pull_request != null }}"
    'steps':
      # The pull request's head, not the merge commit, so the range holds only its own commits.
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        'with':
          'ref': '${{ github.event.pull_request.head.sha }}'
          'fetch-depth': 0
          'persist-credentials': false

      - 'name': 'Check out github-workflows for the attribution guard'
        'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        'with':
          'repository': 'JorisJonkers-dev/github-workflows'
          'ref': 'v0.50.3' # x-release-please-version
          'path': '.github-workflows'
          'persist-credentials': false

      # A caller between a merge and the next release has a github-workflows checkout without the
      # script; skip with a notice rather than fail the caller.
      - 'name': 'Locate the attribution guard'
        'id': 'attribution-script'
        'run': |
          set -euo pipefail

          if [ -f .github-workflows/scripts/attribution_guard.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::.github-workflows has no attribution_guard.py at its pinned release; the attribution guard is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - 'name': 'Check the title, the body and every commit for agent attribution'
        'if': "${{ steps.attribution-script.outputs.present == 'true' }}"
        'env':
          'PR_TITLE': '${{ github.event.pull_request.title }}'
          'PR_BODY': '${{ github.event.pull_request.body }}'
          'PR_AUTHOR': '${{ github.event.pull_request.user.login }}'
          'BASE_REF': '${{ github.event.pull_request.base.ref }}'
          'HEAD_SHA': '${{ github.event.pull_request.head.sha }}'
        'run': |
          set -euo pipefail

          # fetch-depth 0 above fetched every branch (persist-credentials is false, so a
          # fetch here would fail in private repositories).
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::origin/${BASE_REF} is not in the checkout, so the commit range cannot be computed; the guard fails rather than pass unchecked."
            exit 1
          fi
          # Everything the head adds over the base branch's tip: a merge of the base into the
          # branch brings no base commits into the range.
          python3 .github-workflows/scripts/attribution_guard.py --range "origin/${BASE_REF}..${HEAD_SHA}"
