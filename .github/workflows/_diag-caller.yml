# Temporary diagnostic caller. Calls the reusable workflow by full cross-repo
# path so the reusable-workflow contexts populate the way they do for the
# service repositories.
name: Diag Caller
on:
  pull_request:
    paths:
      - ".github/workflows/_diag-*.yml"
permissions: {}
jobs:
  call:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/_diag-reusable.yml@diag/workflow-ref-contexts
