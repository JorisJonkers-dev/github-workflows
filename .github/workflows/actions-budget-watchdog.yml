# Warns while there is still room to act, before the org runs out of Actions
# minutes. This estate ran out mid-working-session with no warning at all:
# every private repo went dark, runs allocated nothing and failed in three
# seconds, and the first sign of it was workflows failing for reasons that
# looked like broken code.
#
# Call this from a PUBLIC repo. Standard runners are free there, so the
# watchdog never contributes to the problem it watches.
name: 'Actions Budget Watchdog'

'on':
  'workflow_call':
    'inputs':
      'allowance-minutes':
        'description': 'Included standard-runner minutes per month for the plan (GitHub Team is 3000).'
        'required': false
        'type': 'number'
        'default': 3000
      'warn-percent':
        'description': 'Emit a warning at or above this percentage of the allowance.'
        'required': false
        'type': 'number'
        'default': 70
      'critical-percent':
        'description': 'Fail the run and raise the alert at or above this percentage.'
        'required': false
        'type': 'number'
        'default': 85
      'alert-repo':
        'description': 'owner/repo to file the sticky alert issue in. Empty disables issue filing.'
        'required': false
        'type': 'string'
        'default': ''
      'alert-labels':
        'description': 'Comma-separated labels for the alert issue. Must already exist in alert-repo.'
        'required': false
        'type': 'string'
        'default': ''
    'secrets':
      'BUDGET_APP_ID':
        'description': 'GitHub App id able to read org billing and repo metadata.'
        'required': false
      'BUDGET_APP_PRIVATE_KEY':
        'description': 'Private key for that App.'
        'required': false
      'BUDGET_TOKEN':
        'description': 'Fallback token with the same access.'
        'required': false

'permissions':
  'contents': 'read'

'jobs':
  'check':
    'name': 'Actions Budget Watchdog'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'env':
      'BUDGET_APP_ID': '${{ secrets.BUDGET_APP_ID }}'
      'BUDGET_APP_PRIVATE_KEY': '${{ secrets.BUDGET_APP_PRIVATE_KEY }}'
    'steps':
      # create-github-app-token FAILS THE JOB when asked for a permission the
      # installation does not hold -- it does not degrade. So the capable mint
      # is allowed to fail instead: continue-on-error means an App without these
      # grants costs a skipped step rather than the whole watchdog, and an App
      # that has them is used automatically with nothing to configure.
      #
      # organization-plan: read  -> the exact billing figure
      # actions: read            -> pricing runs when billing is unreachable
      - 'name': 'Mint organization token (best effort, capable)'
        'id': 'app-token-capable'
        'if': "${{ env.BUDGET_APP_ID != '' && env.BUDGET_APP_PRIVATE_KEY != '' }}"
        'continue-on-error': true
        'uses': 'actions/create-github-app-token@v3'
        'with':
          'app-id': '${{ env.BUDGET_APP_ID }}'
          'private-key': '${{ env.BUDGET_APP_PRIVATE_KEY }}'
          'owner': '${{ github.repository_owner }}'
          'permission-metadata': 'read'
          'permission-issues': 'write'
          'permission-organization-plan': 'read'
          'permission-actions': 'read'

      # Always mintable: these two permissions the App certainly holds. Used
      # only to file the alert issue when the capable mint was refused.
      - 'name': 'Mint organization token (minimal)'
        'id': 'app-token'
        'if': "${{ env.BUDGET_APP_ID != '' && env.BUDGET_APP_PRIVATE_KEY != '' }}"
        'uses': 'actions/create-github-app-token@v3'
        'with':
          'app-id': '${{ env.BUDGET_APP_ID }}'
          'private-key': '${{ env.BUDGET_APP_PRIVATE_KEY }}'
          'owner': '${{ github.repository_owner }}'
          'permission-metadata': 'read'
          'permission-issues': 'write'

      - 'name': 'Check the Actions minute budget'
        'env':
          'GH_TOKEN': "${{ steps.app-token-capable.outputs.token || secrets.BUDGET_TOKEN || steps.app-token.outputs.token || github.token }}"
          'OWNER': '${{ github.repository_owner }}'
          'ALLOWANCE': '${{ inputs.allowance-minutes }}'
          'WARN_PCT': '${{ inputs.warn-percent }}'
          'CRIT_PCT': '${{ inputs.critical-percent }}'
          'ALERT_REPO': '${{ inputs.alert-repo }}'
          'ALERT_LABELS': '${{ inputs.alert-labels }}'
        'run': |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import subprocess
          import sys
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timedelta, timezone

          owner = os.environ['OWNER']
          allowance = float(os.environ['ALLOWANCE'])
          warn_pct = float(os.environ['WARN_PCT'])
          crit_pct = float(os.environ['CRIT_PCT'])
          alert_repo = os.environ.get('ALERT_REPO', '').strip()
          alert_labels = [x.strip() for x in os.environ.get('ALERT_LABELS', '').split(',') if x.strip()]

          MARKER = '<!-- actions-budget-watchdog -->'

          # Included minutes are consumed at a per-runner multiplier, not one
          # minute per minute: a macOS minute costs ten. Counting raw minutes
          # would under-report a macOS-heavy month by an order of magnitude.
          # Unrecognised minute SKUs are surfaced rather than assumed to be 1x,
          # because silently under-counting is the failure that lets a cap
          # arrive unannounced.
          MULTIPLIERS = (
              ('macos', 10.0),
              ('windows', 2.0),
              ('linux', 1.0),
          )

          def multiplier(sku):
              low = sku.lower()
              for needle, mult in MULTIPLIERS:
                  if needle in low:
                      return mult, True
              return 1.0, False

          def gh_json(*args, default=None):
              proc = subprocess.run(['gh', *args], capture_output=True, text=True, check=False)
              if proc.returncode != 0:
                  print(f'::warning::gh {" ".join(args[:3])} failed: {proc.stderr.strip()[:400]}')
                  return default
              try:
                  return json.loads(proc.stdout)
              except json.JSONDecodeError:
                  return default

          # Which repos are private. Public-repo usage appears in the billing
          # response too, fully discounted rather than absent, so including it
          # overstates consumption several times over.
          repos = gh_json('repo', 'list', owner, '--limit', '1000',
                          '--json', 'name,visibility', default=None)
          if repos is None:
              print(f'::error::could not list repositories for {owner}')
              sys.exit(1)
          private = {r['name'] for r in repos if r.get('visibility', '').upper() == 'PRIVATE'}
          print(f'::notice::{len(private)} private repo(s) of {len(repos)} in {owner}')

          now = datetime.now(timezone.utc)

          def from_billing():
              # Exact and authoritative when the token can reach it. The classic
              # /orgs/{org}/settings/billing/actions endpoint returns 410 Gone;
              # this replaces it and needs no admin:org scope -- but billing does
              # sit behind the App's "Organization plan" (read) permission.
              usage = gh_json(
                  'api',
                  f'/organizations/{owner}/settings/billing/usage?year={now.year}&month={now.month}',
                  default=None)
              if usage is None or 'usageItems' not in usage:
                  return None, set()
              acc, unknown = {}, set()
              for item in usage['usageItems']:
                  if item.get('product') != 'actions' or item.get('unitType') != 'Minutes':
                      continue  # skips 'Actions storage', billed in GigabyteHours
                  repo = item.get('repositoryName', '')
                  if repo not in private:
                      continue
                  mult, known = multiplier(item.get('sku', ''))
                  if not known:
                      unknown.add(item.get('sku', ''))
                  acc[repo] = acc.get(repo, 0.0) + float(item.get('quantity', 0)) * mult
              return acc, unknown

          def month_windows():
              # The runs endpoint caps a single query at 1000 results and says
              # nothing when it truncates. fleet-infra alone exceeds that in a
              # month -- an unwindowed query returned 1000 where weekly windows
              # returned 1337, silently losing a quarter of the month. Weekly
              # windows keep every repo well under the cap.
              start = now.replace(day=1).date()
              out, cursor = [], start
              while cursor <= now.date():
                  end = min(cursor + timedelta(days=6), now.date())
                  out.append(f'{cursor.isoformat()}..{end.isoformat()}')
                  cursor = end + timedelta(days=1)
              return out

          def run_ids(repo):
              ids, failures = [], 0
              for window in month_windows():
                  proc = subprocess.run(
                      ['gh', 'api', '--paginate',
                       f'/repos/{owner}/{repo}/actions/runs?per_page=100&created={window}',
                       '--jq', '.workflow_runs[].id'],
                      capture_output=True, text=True, check=False)
                  if proc.returncode != 0:
                      failures += 1
                      continue
                  ids.extend(x for x in proc.stdout.split() if x.strip())
              return ids, failures

          def price_run(job_spec):
              repo, run_id = job_spec
              data = gh_json('api',
                             f'/repos/{owner}/{repo}/actions/runs/{run_id}/jobs?per_page=100',
                             default=None)
              if data is None:
                  return repo, 0.0
              total = 0.0
              for job in data.get('jobs', []):
                  started, completed = job.get('started_at'), job.get('completed_at')
                  if not started or not completed:
                      continue
                  begin = datetime.fromisoformat(started.replace('Z', '+00:00'))
                  finish = datetime.fromisoformat(completed.replace('Z', '+00:00'))
                  seconds = max(0.0, (finish - begin).total_seconds())
                  if seconds <= 0:
                      continue
                  # Billing rounds each job up to a whole minute. Summing raw
                  # durations is the mistake that makes a split pipeline look
                  # cheap; this is the number that is actually charged.
                  labels = ' '.join(job.get('labels') or [])
                  mult, _ = multiplier(labels)
                  total += math.ceil(seconds / 60) * mult
              return repo, total

          def from_actions_api():
              # Fallback when billing is unreachable. Prices every run this month
              # from the Actions API, which needs only actions:read.
              #
              # APPROXIMATE, and it does not bound the error in a known
              # direction. Measured against billing on the same month: 3386 here
              # against 3263 reported, about 4% high. An earlier version that
              # let the runs endpoint truncate read 5% low instead, so the sign
              # of the error depends on what is being missed or double counted
              # -- re-run attempts are the obvious way to overcount, retention
              # ageing the obvious way to undercount.
              #
              # Running slightly high is the safe direction for an alarm: it
              # trips a little early rather than a little late. But do not quote
              # this figure as fact. Fix the billing permission and the exact
              # number comes back.
              specs, list_failures = [], 0
              for repo in sorted(private):
                  ids, failures = run_ids(repo)
                  list_failures += failures
                  specs.extend((repo, rid) for rid in ids)

              # A partial read is not a budget figure. Reporting one as a
              # percentage is how a watchdog produces a reassuring number it has
              # no basis for, so refuse instead -- and refuse loudest when the
              # answer would have been a comfortable zero.
              if list_failures:
                  print(f'::error::could not list workflow runs ({list_failures} query/queries '
                        'refused), so the month cannot be priced.')
                  print('::error::This needs actions: read across the org. Grant the App '
                        '"Actions" (read) and "Organization plan" (read), accept the updated '
                        'installation permissions, or supply BUDGET_TOKEN.')
                  sys.exit(1)
              if not specs:
                  print(f'::error::found zero workflow runs across {len(private)} private '
                        'repo(s) this month, which is not a plausible measurement.')
                  print('::error::Refusing to report 0% -- a budget watchdog that reports no '
                        'usage because it cannot see usage is worse than one that is absent, '
                        'because it looks like good news.')
                  sys.exit(1)

              print(f'::notice::pricing {len(specs)} run(s) from the Actions API')
              acc = {}
              with ThreadPoolExecutor(max_workers=8) as pool:
                  for repo, minutes in pool.map(price_run, specs):
                      acc[repo] = acc.get(repo, 0.0) + minutes
              return acc

          per_repo, unknown_skus = from_billing()
          source = 'billing API (exact)'
          approximate = False

          if per_repo is None:
              print('::warning::could not read the org billing usage endpoint; '
                    'falling back to pricing runs from the Actions API.')
              print('::warning::A 403 "Resource not accessible by integration" means the App '
                    'lacks the "Organization plan" (read) permission: grant it, accept the '
                    'updated installation permissions, then set app-has-billing-permission '
                    'true. Repo listing working while billing fails is exactly that case. '
                    'Supplying BUDGET_TOKEN also works.')
              per_repo = from_actions_api()
              unknown_skus = set()
              source = 'Actions API (lower bound)'
              approximate = True

          for sku in sorted(unknown_skus):
              print(f'::warning::unrecognised Actions minute SKU {sku!r}, counted at 1x; '
                    'confirm its multiplier or this figure under-reports')

          used = sum(per_repo.values())
          pct = (used / allowance * 100) if allowance else 0.0
          top = sorted(per_repo.items(), key=lambda kv: -kv[1])[:10]

          qualifier = 'about ' if approximate else ''
          headline = (f'{qualifier}{used:.0f} of {allowance:.0f} included minutes used '
                      f'({pct:.0f}%) by private repos in {now:%B %Y}')
          print(f'::notice::{headline} [source: {source}]')

          table = '\n'.join(f'| `{r}` | {m:.0f} |' for r, m in top) or '| _none_ | 0 |'
          body_detail = (
              f'| repo | minutes |\n| --- | --- |\n{table}\n\n'
              f'_Month to date, {now:%Y-%m-%d}. Source: {source}. Private repositories '
              'only; public-repo usage is free and excluded. Minutes are weighted by '
              'runner multiplier (macOS 10x, Windows 2x, Linux 1x), which is how the '
              'allowance is actually consumed._'
              + ('\n\n_Billing was unreachable, so this is priced from the Actions API '
                 'rather than read from billing. Treat it as **approximate**: measured '
                 'against billing on the same month it ran about 4% high. Good enough to '
                 'alarm on, not a figure to quote. Grant the App "Organization plan" '
                 '(read) to restore the exact number._' if approximate else '')
          )

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as fh:
                  fh.write(f'## Actions budget\n\n**{headline}**\n\n{body_detail}\n')

          level = 'ok'
          if pct >= crit_pct:
              level = 'critical'
          elif pct >= warn_pct:
              level = 'warning'

          if level == 'ok':
              print(f'::notice::below the {warn_pct:.0f}% warning threshold; nothing to raise')
              sys.exit(0)

          if level == 'warning':
              print(f'::warning::{headline} — past the {warn_pct:.0f}% warning threshold')

          if alert_repo:
              title = f'Actions minutes at {pct:.0f}% of the monthly allowance'
              body = (
                  f'{MARKER}\n'
                  f'**{headline}**\n\n'
                  f'{body_detail}\n\n'
                  f'Thresholds: warn at {warn_pct:.0f}%, critical at {crit_pct:.0f}%.\n\n'
                  'When the allowance runs out, private-repo runs are created but '
                  'allocated no runner: they fail within seconds with zero steps '
                  'executed, which reads as broken code rather than an exhausted '
                  'budget. Public repos keep working throughout.\n\n'
                  '_Raised by the Actions Budget Watchdog. This issue is updated in '
                  'place rather than reopened each run._'
              )
              existing = gh_json('issue', 'list', '--repo', alert_repo, '--state', 'open',
                                 '--search', MARKER, '--json', 'number', default=[]) or []
              if existing:
                  num = str(existing[0]['number'])
                  subprocess.run(['gh', 'issue', 'edit', num, '--repo', alert_repo,
                                  '--title', title, '--body', body], check=False)
                  print(f'::notice::updated {alert_repo}#{num}')
              else:
                  args = ['gh', 'issue', 'create', '--repo', alert_repo,
                          '--title', title, '--body', body]
                  for lab in alert_labels:
                      args += ['--label', lab]
                  proc = subprocess.run(args, capture_output=True, text=True, check=False)
                  if proc.returncode == 0:
                      print(f'::notice::raised {proc.stdout.strip()}')
                  else:
                      # Most likely a label that does not exist in alert-repo.
                      print(f'::warning::could not file the alert issue: {proc.stderr.strip()[:400]}')

          # Critical fails the run so it is visibly red even if nobody reads
          # issues. Warning stays green: it is information, not an incident.
          if level == 'critical':
              print(f'::error::{headline} — at or past the {crit_pct:.0f}% critical threshold')
              sys.exit(1)
          PY
