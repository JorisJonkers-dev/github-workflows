name: Require Packages Proxy Token
description: >-
  Fail the job when the packages proxy token is missing, so no step installs
  third-party packages without the proxy. A pull request from a fork, which
  the token is not available to, warns and continues without the proxy.

inputs:
  token:
    description: The packages proxy token, typically the PACKAGES_PROXY_TOKEN secret.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Require the packages proxy token
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.token }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        if [ -n "$PACKAGES_PROXY_TOKEN" ]; then
          exit 0
        fi

        # A fork cannot read the org secret, so its pull requests warn and
        # install directly instead of failing.
        if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "::warning::The packages proxy token is not available to pull requests from forks; packages install directly from upstream."
          exit 0
        fi

        echo "::error::The packages proxy token is empty. Pass the PACKAGES_PROXY_TOKEN secret to the workflow call with secrets: inherit, or the one-line form documented in the github-workflows README."
        exit 1
