name: Setup Node
description: Configure Node, package-manager caching, and install workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'
  package-manager:
    description: Package manager to configure. Supported values are npm, pnpm, and yarn.
    required: false
    default: pnpm
  cache-dependency-path:
    description: Path to the package-manager lockfile or lockfiles used for caching.
    required: false
    default: ''
  working-directory:
    description: Directory where dependencies should be installed.
    required: false
    default: .
  install-command:
    description: Command used to install dependencies. Defaults by package-manager when empty.
    required: false
    default: ''
  github-packages-token:
    description: GitHub Packages token used to authenticate npm package installs.
    required: false
    default: ''
  npm-scope:
    description: npm scope resolved from GitHub Packages when github-packages-token is set.
    required: false
    default: '@jorisjonkers-dev'
  github-packages-registry:
    description: npm registry URL used for the configured GitHub Packages scope.
    required: false
    default: https://npm.pkg.github.com

runs:
  using: composite
  steps:
    - name: Validate package manager
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        case "$PACKAGE_MANAGER" in
          npm|pnpm|yarn)
            ;;
          *)
            echo "::error::Unsupported package-manager: $PACKAGE_MANAGER. Use npm, pnpm, or yarn."
            exit 1
            ;;
        esac

    - name: Enable Corepack for Yarn
      if: ${{ inputs.package-manager == 'yarn' }}
      shell: bash
      run: corepack enable

    - name: Set up pnpm
      if: ${{ inputs.package-manager == 'pnpm' }}
      uses: pnpm/action-setup@v6

    # Only a push to the default branch saves the cache; other runs restore its latest below, so
    # pull requests never evict it from the repository's 10 GB.
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && inputs.package-manager || '' }}
        package-manager-cache: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Locate the package cache
      id: package-cache
      if: ${{ !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail

        case "$PACKAGE_MANAGER" in
          npm) dir=$(npm config get cache) ;;
          pnpm) dir=$(pnpm store path --silent) ;;
          yarn) dir=$(yarn config get cacheFolder 2>/dev/null || yarn cache dir) ;;
        esac
        # setup-node's own key: node-cache-<os>-<arch>-<package manager>-<lockfile hash>.
        printf 'path=%s\nprefix=node-cache-%s-%s-%s-\n' "$dir" "$RUNNER_OS" "$(node -p process.arch)" "$PACKAGE_MANAGER" >> "$GITHUB_OUTPUT"

    - name: Restore the default branch's package cache
      if: ${{ !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.package-cache.outputs.path }}
        key: ${{ steps.package-cache.outputs.prefix }}restore-only
        restore-keys: ${{ steps.package-cache.outputs.prefix }}

    - name: Configure GitHub Packages for npm
      if: ${{ inputs.github-packages-token != '' }}
      shell: bash
      env:
        GITHUB_PACKAGES_TOKEN: ${{ inputs.github-packages-token }}
        GITHUB_PACKAGES_REGISTRY: ${{ inputs.github-packages-registry }}
        NPM_SCOPE: ${{ inputs.npm-scope }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        scope="$NPM_SCOPE"
        case "$scope" in
          @*)
            ;;
          *)
            scope="@$scope"
            ;;
        esac

        registry="${GITHUB_PACKAGES_REGISTRY%/}"
        registry_host="${registry#http://}"
        registry_host="${registry_host#https://}"
        npmrc_path="$WORKING_DIRECTORY/.npmrc"

        mkdir -p "$WORKING_DIRECTORY"
        touch "$npmrc_path"
        {
          printf '%s:registry=%s\n' "$scope" "$registry"
          printf '//%s/:_authToken=%s\n' "$registry_host" "$GITHUB_PACKAGES_TOKEN"
        } >> "$npmrc_path"

        printf 'NODE_AUTH_TOKEN=%s\n' "$GITHUB_PACKAGES_TOKEN" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        if [ -z "$INSTALL_COMMAND" ]; then
          case "$PACKAGE_MANAGER" in
            npm)
              INSTALL_COMMAND="npm ci"
              ;;
            pnpm)
              INSTALL_COMMAND="pnpm install --frozen-lockfile"
              ;;
            yarn)
              INSTALL_COMMAND="yarn install --immutable"
              ;;
          esac
        fi

        bash -c "$INSTALL_COMMAND"
