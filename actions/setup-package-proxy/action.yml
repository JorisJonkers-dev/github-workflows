name: Setup Packages Proxy
description: >-
  Credentials, environment and bounded retries for the packages proxy. Writes a
  netrc file, an npm config, a Cargo config and Gradle retry properties, and
  exports Go and Python package manager variables so downloads go through the
  proxy. Without a token it warns (or fails when require-package-proxy is true);
  a fork pull request only warns.

inputs:
  token:
    description: >-
      Packages proxy API token, typically secrets.PACKAGES_PROXY_TOKEN. Empty
      warns (or fails with require-package-proxy) and leaves downloads direct.
    required: false
    default: ''
  require-package-proxy:
    description: When true, a missing token fails the job. Empty or false only warns.
    required: false
    default: 'false'
  go:
    description: Export GOPROXY and GOPRIVATE so Go module downloads use the proxy, and put proxy-retry on PATH (Go has no retry of its own; wrap fetches as `proxy-retry go mod download`).
    required: false
    default: 'true'
  python:
    description: Export PIP_INDEX_URL and UV_DEFAULT_INDEX so Python packages use the proxy.
    required: false
    default: 'true'
  node:
    description: Write an npm user config so npm, pnpm and yarn use the proxy registry.
    required: false
    default: 'true'
  cargo:
    description: Write a Cargo config that replaces crates.io with the proxy and export its token.
    required: false
    default: 'true'
  gradle:
    description: Write retry and timeout properties to the Gradle user home.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Check packages proxy token
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.token }}
        REQUIRE_PACKAGE_PROXY: ${{ inputs.require-package-proxy }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        if [ -n "$PACKAGES_PROXY_TOKEN" ]; then
          exit 0
        fi
        if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "::warning::PACKAGES_PROXY_TOKEN is not available to pull requests from forks; packages install without the proxy."
          exit 0
        fi
        if [ "$REQUIRE_PACKAGE_PROXY" = true ]; then
          echo "::error::PACKAGES_PROXY_TOKEN is not set and require-package-proxy is true. Pass the PACKAGES_PROXY_TOKEN secret: secrets: inherit, or the one-line form in README.md."
          exit 1
        fi
        echo "::warning::PACKAGES_PROXY_TOKEN is not set; packages install without the proxy. Pass the secret, or set require-package-proxy to true to fail instead."

    - name: Write packages proxy netrc
      if: ${{ inputs.token != '' }}
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"

        # Go, pip and uv all read ~/.netrc, so the token never has to sit in
        # an environment variable or URL of its own.
        umask 077
        netrc="$HOME/.netrc"
        {
          # Rebuild from the old file minus our entry, so re-runs and token
          # rotations do not stack stale proxy credentials.
          if [ -f "$netrc" ]; then
            awk 'BEGIN { keep = 1 } $1 == "machine" { keep = $2 != "packages.jorisjonkers.dev" } $1 == "default" { keep = 1 } keep { print }' "$netrc"
          fi
          printf 'machine packages.jorisjonkers.dev\n'
          printf 'login packages\n'
          printf 'password %s\n' "$PACKAGES_PROXY_TOKEN"
        } > "$netrc.tmp"
        mv "$netrc.tmp" "$netrc"
        chmod 600 "$netrc"

    - name: Export package proxy environment
      if: ${{ inputs.token != '' }}
      shell: bash
      env:
        EXPORT_GO: ${{ inputs.go }}
        EXPORT_PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail

        # Without ,direct so private module fetches have no fallback that
        # could bypass the proxy and leak.
        if [ "$EXPORT_GO" = 'true' ]; then
          {
            printf 'GOPROXY=https://packages.jorisjonkers.dev/go\n'
            printf 'GOPRIVATE=github.com/JorisJonkers-dev/*\n'
          } >> "$GITHUB_ENV"
        fi

        if [ "$EXPORT_PYTHON" = 'true' ]; then
          {
            printf 'PIP_INDEX_URL=https://packages.jorisjonkers.dev/pypi/simple/\n'
            printf 'UV_DEFAULT_INDEX=https://packages.jorisjonkers.dev/pypi/simple/\n'
            # pip and uv retry a failed fetch on their own; these raise the count
            # and the per-request timeout so a short proxy outage is ridden out.
            printf 'PIP_RETRIES=9\n'
            printf 'UV_HTTP_RETRIES=8\n'
            printf 'UV_HTTP_TIMEOUT=60\n'
          } >> "$GITHUB_ENV"
        fi

    - name: Put the retry helper on PATH
      if: ${{ inputs.token != '' && inputs.go == 'true' }}
      shell: bash
      env:
        RETRY_HELPER_DIR: ${{ github.action_path }}/bin
      run: |
        set -euo pipefail

        # Go has no retry of its own, so a fetch is wrapped: proxy-retry go mod download
        printf '%s\n' "$RETRY_HELPER_DIR" >> "$GITHUB_PATH"

    - name: Configure packages proxy for npm
      if: ${{ inputs.token != '' && inputs.node == 'true' }}
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"

        umask 077
        npm_key="$PACKAGES_PROXY_TOKEN"
        # NPM_CONFIG_USERCONFIG is used when it points outside the workspace; setup-node with
        # registry-url puts its file in RUNNER_TEMP. Inside the workspace it could land in the
        # checkout, so $HOME/.npmrc is used and NPM_CONFIG_USERCONFIG is pointed at it instead.
        userconfig="$HOME/.npmrc"
        workspace="${GITHUB_WORKSPACE:-}"
        if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
          inside=false
          if [ -n "$workspace" ]; then
            case "$NPM_CONFIG_USERCONFIG" in
              "$workspace"|"$workspace"/*) inside=true ;;
            esac
          fi
          if [ "$inside" = true ]; then
            echo "::warning::NPM_CONFIG_USERCONFIG points inside the workspace; the proxy block goes to $HOME/.npmrc, and NPM_CONFIG_USERCONFIG is set to that file for later steps."
            printf 'NPM_CONFIG_USERCONFIG=%s\n' "$HOME/.npmrc" >> "$GITHUB_ENV"
          else
            userconfig="$NPM_CONFIG_USERCONFIG"
          fi
        fi
        touch "$userconfig"
        chmod 600 "$userconfig"
        {
          awk '$0 == "# BEGIN packages-proxy" { skip = 1 } !skip { print } $0 == "# END packages-proxy" { skip = 0 }' "$userconfig"
          printf '# BEGIN packages-proxy\n'
          printf 'registry=https://packages.jorisjonkers.dev/npm/\n'
          printf '//packages.jorisjonkers.dev/npm/:_authToken=%s\n' "$npm_key"
          printf '@jorisjonkers-dev:registry=https://npm.pkg.github.com\n'
          # npm and pnpm both read these: 9 retries with a doubling backoff from
          # 2s capped at 30s, up to ~180s in all (retry delays are randomised,
          # so about half of that is the expectation).
          printf 'fetch-retries=9\n'
          printf 'fetch-retry-factor=2\n'
          printf 'fetch-retry-mintimeout=2000\n'
          printf 'fetch-retry-maxtimeout=30000\n'
          printf '# END packages-proxy\n'
        } > "$userconfig.tmp"
        mv "$userconfig.tmp" "$userconfig"
        chmod 600 "$userconfig"

    - name: Configure packages proxy for Cargo
      if: ${{ inputs.token != '' && inputs.cargo == 'true' }}
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"
        printf '::add-mask::Bearer %s\n' "$PACKAGES_PROXY_TOKEN"

        # Source replacement: crates.io is served by the proxy's Cargo registry. The
        # token travels only as a masked environment variable, never in the config.
        umask 077
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        mkdir -p "$cargo_home"
        config="$cargo_home/config.toml"
        touch "$config"
        chmod 600 "$config"
        {
          awk '$0 == "# BEGIN packages-proxy" { skip = 1 } !skip { print } $0 == "# END packages-proxy" { skip = 0 }' "$config"
          printf '# BEGIN packages-proxy\n'
          # Cargo sends the registry token only for a named registry in [registries], and only with
          # the cargo:token credential provider. Without both, a source replacement of an
          # authenticated registry fails with "authenticated registries require a credential-provider".
          printf '[registry]\n'
          printf 'global-credential-providers = ["cargo:token"]\n\n'
          printf '[registries.jorisjonkers-packages]\n'
          printf 'index = "sparse+https://packages.jorisjonkers.dev/cargo/"\n\n'
          printf '[source.crates-io]\n'
          printf 'replace-with = "jorisjonkers-packages"\n\n'
          printf '[source.jorisjonkers-packages]\n'
          printf 'registry = "sparse+https://packages.jorisjonkers.dev/cargo/"\n'
          printf '# END packages-proxy\n'
        } > "$config.tmp"
        mv "$config.tmp" "$config"
        chmod 600 "$config"

        {
          printf 'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_TOKEN=Bearer %s\n' "$PACKAGES_PROXY_TOKEN"
        } >> "$GITHUB_ENV"

    - name: Configure packages proxy retries for Gradle
      if: ${{ inputs.token != '' && inputs.gradle == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        # Gradle retries a failed repository request on its own; these raise the
        # attempt counts and the timeouts so a short proxy outage is ridden out.
        # The property names are Gradle's own, including the capital O in the
        # network.retry backOff and the lowercase one in the repository backoff.
        gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$gradle_home"
        props="$gradle_home/gradle.properties"
        touch "$props"
        umask 077
        {
          awk '$0 == "# BEGIN packages-proxy" { skip = 1 } !skip { print } $0 == "# END packages-proxy" { skip = 0 }' "$props"
          printf '# BEGIN packages-proxy\n'
          printf 'systemProp.org.gradle.internal.http.connectionTimeout=60000\n'
          printf 'systemProp.org.gradle.internal.http.socketTimeout=60000\n'
          printf 'systemProp.org.gradle.internal.repository.max.tentatives=8\n'
          printf 'systemProp.org.gradle.internal.repository.initial.backoff=1000\n'
          printf 'systemProp.org.gradle.internal.network.retry.max.attempts=8\n'
          printf 'systemProp.org.gradle.internal.network.retry.initial.backOff=1000\n'
          printf '# END packages-proxy\n'
        } > "$props.tmp"
        # The file may hold the GitHub Packages token, so it stays private.
        chmod 600 "$props.tmp"
        mv "$props.tmp" "$props"
