name: Setup Java And Gradle
description: Configure Java and Gradle caching for CI jobs.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: '21'
  java-distribution:
    description: Java distribution to install.
    required: false
    default: temurin
  gradle-cache-disabled:
    description: Whether to disable Gradle dependency caching.
    required: false
    default: 'false'
  gradle-cache-read-only:
    description: Whether Gradle cache entries should be restored without saving updates. Empty means read-only everywhere but a push to the default branch, so pull requests never evict its cache.
    required: false
    default: ''
  github-packages-actor:
    description: GitHub Packages actor exposed to Gradle as GITHUB_ACTOR when github-packages-token is set. Empty defaults to github.actor.
    required: false
    default: ''
  github-packages-token:
    description: GitHub Packages token exposed to Gradle as GITHUB_TOKEN.
    required: false
    default: ''
  packages-proxy-token:
    description: Packages proxy API token. When set, Gradle resolves dependencies through the packages proxy instead of direct upstream repositories.
    required: false
    default: ''
  require-package-proxy:
    description: When true, a missing packages-proxy-token fails the job. Empty or false only warns.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check packages proxy token
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.packages-proxy-token }}
        REQUIRE_PACKAGE_PROXY: ${{ inputs.require-package-proxy }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        if [ -n "$PACKAGES_PROXY_TOKEN" ]; then
          exit 0
        fi
        if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "::warning::PACKAGES_PROXY_TOKEN is not available to pull requests from forks; packages install without the proxy."
          exit 0
        fi
        if [ "$REQUIRE_PACKAGE_PROXY" = true ]; then
          echo "::error::PACKAGES_PROXY_TOKEN is not set and require-package-proxy is true. Pass the PACKAGES_PROXY_TOKEN secret: secrets: inherit, or the one-line form in README.md."
          exit 1
        fi
        echo "::warning::PACKAGES_PROXY_TOKEN is not set; packages install without the proxy. Pass the secret, or set require-package-proxy to true to fail instead."

    - name: Configure GitHub Packages for Gradle
      if: ${{ inputs.github-packages-token != '' }}
      shell: bash
      env:
        DEFAULT_GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_PACKAGES_ACTOR: ${{ inputs.github-packages-actor }}
        GITHUB_PACKAGES_TOKEN: ${{ inputs.github-packages-token }}
      run: |
        set -euo pipefail

        actor="${GITHUB_PACKAGES_ACTOR:-$DEFAULT_GITHUB_ACTOR}"
        {
          printf 'GITHUB_ACTOR=%s\n' "$actor"
          printf 'GITHUB_TOKEN=%s\n' "$GITHUB_PACKAGES_TOKEN"
        } >> "$GITHUB_ENV"

    - name: Configure packages proxy for Gradle
      if: ${{ inputs.packages-proxy-token != '' }}
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.packages-proxy-token }}
      run: |
        set -euo pipefail

        # Mask before anything else; the token is then written to the
        # environment for Gradle to read in later steps.
        printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"

        printf 'PACKAGES_PROXY_TOKEN=%s\n' "$PACKAGES_PROXY_TOKEN" >> "$GITHUB_ENV"

        init_dir="$HOME/.gradle/init.d"
        mkdir -p "$init_dir"
        cat > "$init_dir/packages-proxy.init.gradle.kts" <<'KTS'
        // Route dependency resolution through the packages proxy. First-party
        // GitHub Packages repositories stay direct; everything else is moved
        // behind the proxy.
        fun ArtifactRepository.isAllowed(): Boolean = when (this) {
            is MavenArtifactRepository -> {
                val host = runCatching { url.host }.getOrNull()
                host == "maven.pkg.github.com" || host == "packages.jorisjonkers.dev"
            }
            is FlatDirectoryArtifactRepository, is IvyArtifactRepository -> true
            else -> false
        }

        fun RepositoryHandler.addPackagesProxy() {
            maven {
                name = "packagesProxy"
                setUrl("https://packages.jorisjonkers.dev/maven/")
                packagesProxyAuthentication()
            }
            maven {
                name = "packagesProxySpringMilestone"
                setUrl("https://packages.jorisjonkers.dev/maven/spring-milestone/")
                packagesProxyAuthentication()
            }
            maven {
                name = "packagesProxySonatypeSnapshots"
                setUrl("https://packages.jorisjonkers.dev/maven/sonatype-snapshots/")
                content { mavenContent { snapshotsOnly() } }
                packagesProxyAuthentication()
            }
            maven {
                name = "packagesProxyGoogleMaven"
                setUrl("https://packages.jorisjonkers.dev/maven/google-maven/")
                packagesProxyAuthentication()
            }
        }

        // `all` also runs for every repository added later, so a repository a
        // build script declares after this point is removed as it is added
        // (Gradle's own "enterprise repository" init-script pattern).
        //
        // always = true adds the proxy repositories up front (settings). With
        // always = false (projects) they are added only once the project itself
        // declared a third-party repository: a project that declares none must
        // stay empty, or Gradle stops using the settings repositories (GitHub
        // Packages among them) and fails under FAIL_ON_PROJECT_REPOS.
        fun RepositoryHandler.usePackagesProxy(always: Boolean) {
            var added = false
            if (always) {
                addPackagesProxy()
                added = true
            }
            all {
                if (!isAllowed()) {
                    remove(this)
                    if (!added) {
                        added = true
                        addPackagesProxy()
                    }
                }
            }
        }

        fun MavenArtifactRepository.packagesProxyAuthentication() {
            credentials(HttpHeaderCredentials::class) {
                name = "Authorization"
                value = "Bearer " + System.getenv("PACKAGES_PROXY_TOKEN")
            }
            authentication {
                create<HttpHeaderAuthentication>("header")
            }
        }

        settingsEvaluated {
            pluginManagement.repositories.usePackagesProxy(always = true)
            dependencyResolutionManagement.repositories.usePackagesProxy(always = true)
        }

        // Before the project's own build script runs, so its `repositories {}`
        // and `buildscript { repositories {} }` blocks add to handlers that
        // already drop third-party repositories.
        beforeProject {
            buildscript.repositories.usePackagesProxy(always = false)
            repositories.usePackagesProxy(always = false)
        }
        KTS

    - uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: ${{ inputs.gradle-cache-disabled }}
        cache-read-only: ${{ inputs.gradle-cache-read-only != '' && inputs.gradle-cache-read-only || !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
