name: Setup Java And Gradle
description: Configure Java and Gradle caching for CI jobs.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: '21'
  java-distribution:
    description: Java distribution to install.
    required: false
    default: temurin
  gradle-cache-disabled:
    description: Whether to disable Gradle dependency caching.
    required: false
    default: 'false'
  gradle-cache-read-only:
    description: Whether Gradle cache entries should be restored without saving updates. Empty means read-only everywhere but a push to the default branch, so pull requests never evict its cache.
    required: false
    default: ''
  github-packages-actor:
    description: GitHub Packages actor exposed to Gradle as GITHUB_ACTOR when github-packages-token is set. Empty defaults to github.actor.
    required: false
    default: ''
  github-packages-token:
    description: GitHub Packages token exposed to Gradle as GITHUB_TOKEN.
    required: false
    default: ''
  packages-proxy-token:
    description: Packages proxy API token. When set, Gradle resolves dependencies through the packages proxy instead of direct upstream repositories.
    required: false
    default: ''
  require-package-proxy:
    description: When true, a missing packages-proxy-token fails the job. Empty or false only warns.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check packages proxy token
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.packages-proxy-token }}
        REQUIRE_PACKAGE_PROXY: ${{ inputs.require-package-proxy }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        if [ -n "$PACKAGES_PROXY_TOKEN" ]; then
          exit 0
        fi
        if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "::warning::PACKAGES_PROXY_TOKEN is not available to pull requests from forks; packages install without the proxy."
          exit 0
        fi
        if [ "$REQUIRE_PACKAGE_PROXY" = true ]; then
          echo "::error::PACKAGES_PROXY_TOKEN is not set and require-package-proxy is true. Pass the PACKAGES_PROXY_TOKEN secret: secrets: inherit, or the one-line form in README.md."
          exit 1
        fi
        echo "::warning::PACKAGES_PROXY_TOKEN is not set; packages install without the proxy. Pass the secret, or set require-package-proxy to true to fail instead."

    - name: Configure GitHub Packages for Gradle
      if: ${{ inputs.github-packages-token != '' }}
      shell: bash
      env:
        DEFAULT_GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_PACKAGES_ACTOR: ${{ inputs.github-packages-actor }}
        GITHUB_PACKAGES_TOKEN: ${{ inputs.github-packages-token }}
      run: |
        set -euo pipefail

        actor="${GITHUB_PACKAGES_ACTOR:-$DEFAULT_GITHUB_ACTOR}"
        {
          printf 'GITHUB_ACTOR=%s\n' "$actor"
          printf 'GITHUB_TOKEN=%s\n' "$GITHUB_PACKAGES_TOKEN"
        } >> "$GITHUB_ENV"

    - name: Configure packages proxy for Gradle
      if: ${{ inputs.packages-proxy-token != '' }}
      shell: bash
      env:
        PACKAGES_PROXY_TOKEN: ${{ inputs.packages-proxy-token }}
      run: |
        set -euo pipefail

        # Mask before anything else; the token is then written to the
        # environment for Gradle to read in later steps.
        printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"

        printf 'PACKAGES_PROXY_TOKEN=%s\n' "$PACKAGES_PROXY_TOKEN" >> "$GITHUB_ENV"

        init_dir="$HOME/.gradle/init.d"
        mkdir -p "$init_dir"
        cat > "$init_dir/packages-proxy.init.gradle.kts" <<'KTS'
        // Route dependency resolution through the packages proxy. First-party GitHub
        // Packages and local (file) repositories stay as they are; every other Maven
        // repository keeps its place but has its URL rewritten to the proxy's
        // equivalent, with the proxy's credentials. Nothing is added or removed, so
        // repository order, the settings-versus-project choice and
        // FAIL_ON_PROJECT_REPOS all behave as the build declared them.
        val proxy = "https://packages.jorisjonkers.dev/maven/"

        fun proxyUrlFor(url: java.net.URI): String? {
            val host = url.host ?: return null
            if (url.scheme == "file" || host == "maven.pkg.github.com" || host == "packages.jorisjonkers.dev") return null
            val path = url.path ?: ""
            return when {
                host == "repo.spring.io" && path.startsWith("/milestone") -> proxy + "spring-milestone/"
                host.endsWith("sonatype.org") || host == "central.sonatype.com" && path.contains("snapshots") -> proxy + "sonatype-snapshots/"
                host == "maven.google.com" || host == "dl.google.com" -> proxy + "google-maven/"
                else -> proxy // Maven Central, the Gradle Plugin Portal, and any other mirror of Central
            }
        }

        fun RepositoryHandler.usePackagesProxy() {
            all {
                val repo = this as? MavenArtifactRepository ?: return@all
                val target = runCatching { proxyUrlFor(repo.url) }.getOrNull() ?: return@all
                repo.setUrl(target)
                repo.credentials(HttpHeaderCredentials::class) {
                    name = "Authorization"
                    value = "Bearer " + System.getenv("PACKAGES_PROXY_TOKEN")
                }
                repo.authentication {
                    create<HttpHeaderAuthentication>("header")
                }
            }
        }

        settingsEvaluated {
            pluginManagement.repositories.usePackagesProxy()
            dependencyResolutionManagement.repositories.usePackagesProxy()
        }

        beforeProject {
            buildscript.repositories.usePackagesProxy()
            repositories.usePackagesProxy()
        }
        KTS

    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: ${{ inputs.gradle-cache-disabled }}
        cache-read-only: ${{ inputs.gradle-cache-read-only != '' && inputs.gradle-cache-read-only || !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
